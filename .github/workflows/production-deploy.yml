name: Production Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build, verify, and deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Security verification
        run: npm run verify:security

      - name: Isolated real PM2 release and recovery smoke
        run: |
          set -euo pipefail
          PM2_TEST_DIR="$(mktemp -d "$RUNNER_TEMP/theraply-pm2-package.XXXXXX")"
          trap 'rm -rf "$PM2_TEST_DIR"' EXIT
          npm install --prefix "$PM2_TEST_DIR" --ignore-scripts --no-audit --no-fund pm2@7.0.4
          node scripts/verify-pm2-release.mjs --pm2-cli="$PM2_TEST_DIR/node_modules/pm2/bin/pm2"

      - name: Build
        run: npm run build

      - name: Build manual Wix CMS CLI
        run: npm run build:wix-cli

      - name: Prepare deployment artifact
        run: |
          set -euo pipefail
          rm -rf deploy_artifact
          mkdir -p deploy_artifact
          cp package.json package-lock.json ecosystem.config.js deploy_artifact/
          [ -f next.config.ts ] && cp next.config.ts deploy_artifact/
          [ -f next.config.js ] && cp next.config.js deploy_artifact/
          [ -f prisma.config.ts ] && cp prisma.config.ts deploy_artifact/
          [ -d public ] && cp -R public deploy_artifact/
          [ -d prisma ] && cp -R prisma deploy_artifact/
          cp -R .next deploy_artifact/
          mkdir -p deploy_artifact/build
          cp -R build/wix-cms deploy_artifact/build/
          mkdir -p deploy_artifact/scripts
          cp scripts/deploy-production-release.mjs deploy_artifact/scripts/
          printf '%s\n' "$GITHUB_SHA" > deploy_artifact/RELEASE_SHA
          rm -rf deploy_artifact/.next/cache

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Upload isolated candidate release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          set -euo pipefail
          RELEASE="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "set -eu; test -d /var/www/theraply; test ! -L /var/www/theraply; mkdir -p /var/www/theraply/releases; test ! -L /var/www/theraply/releases; mkdir /var/www/theraply/releases/$RELEASE"
          rsync -az \
            --exclude='.env' \
            --exclude='logs/' \
            --exclude='uploads/' \
            --exclude='storage/' \
            -e "ssh -i ~/.ssh/deploy_key -p $VPS_PORT" \
            deploy_artifact/ "$VPS_USER@$VPS_HOST:/var/www/theraply/releases/$RELEASE/"

      - name: Verify backup, prepare, migrate, activate, and verify release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          set -euo pipefail
          RELEASE="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "flock -n /var/www/theraply/.deploy.lock node /var/www/theraply/releases/$RELEASE/scripts/deploy-production-release.mjs /var/www/theraply $RELEASE $GITHUB_SHA"
